<script>
    document.addEventListener('DOMContentLoaded', () => {
      const lockBtn = document.getElementById('lockToggleBtn');
      const lockIcon = document.getElementById('lockIcon');
      const lockStatusText = document.getElementById('lockStatusText');
      let isLocked = true;

      // Lock Dial Interaction
      if (lockBtn) {
        lockBtn.addEventListener('click', () => {
          isLocked = !isLocked;
          
          if (!isLocked) {
            // Unlocked State
            lockIcon.textContent = 'lock_open';
            lockIcon.setAttribute('data-icon', 'lock_open');
            lockIcon.classList.remove('text-on-surface');
            lockIcon.classList.add('text-primary');
            lockStatusText.textContent = 'UNLOCKED';
            lockStatusText.classList.add('text-primary');
            
            // Auto re-lock simulate calm luxury security
            setTimeout(() => {
              if (!isPassageActive) {
                isLocked = true;
                lockIcon.textContent = 'lock';
                lockIcon.setAttribute('data-icon', 'lock');
                lockIcon.classList.remove('text-primary');
                lockIcon.classList.add('text-on-surface');
                lockStatusText.textContent = 'LOCKED';
                lockStatusText.classList.remove('text-primary');
              }
            }, 6000);
          } else {
            // Locked State
            lockIcon.textContent = 'lock';
            lockIcon.setAttribute('data-icon', 'lock');
            lockIcon.classList.remove('text-primary');
            lockIcon.classList.add('text-on-surface');
            lockStatusText.textContent = 'LOCKED';
            lockStatusText.classList.remove('text-primary');
          }
        });
      }

      // Passage Mode Toggle
      const passageToggle = document.getElementById('passageToggle');
      const passageThumb = document.getElementById('passageThumb');
      let isPassageActive = false;

      if (passageToggle && passageThumb) {
        passageToggle.addEventListener('click', () => {
          isPassageActive = !isPassageActive;
          passageToggle.setAttribute('aria-checked', isPassageActive);

          if (isPassageActive) {
            passageToggle.classList.remove('bg-surface-container-highest', 'border-outline-variant/50');
            passageToggle.classList.add('bg-primary', 'border-primary');
            passageThumb.classList.remove('translate-x-0.5', 'bg-on-surface-variant');
            passageThumb.classList.add('translate-x-4', 'bg-surface');
          } else {
            passageToggle.classList.add('bg-surface-container-highest', 'border-outline-variant/50');
            passageToggle.classList.remove('bg-primary', 'border-primary');
            passageThumb.classList.add('translate-x-0.5', 'bg-on-surface-variant');
            passageThumb.classList.remove('translate-x-4', 'bg-surface');
          }
        });
      }
    });
  </script>
